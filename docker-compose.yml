services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/init-kafka.sh:/scripts/init-kafka.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-kafka.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: priorauth-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  payer-postgres:
    image: postgres:16
    container_name: payer-postgres
    environment:
      POSTGRES_DB: payer_db
      POSTGRES_USER: payer
      POSTGRES_PASSWORD: payer
    ports:
      - "5434:5432"
    volumes:
      - payer_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payer -d payer_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
  provider-postgres:
    image: postgres:16
    container_name: provider-postgres
    environment:
      POSTGRES_DB: provider_db
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider
    ports:
      - "5433:5432"
    volumes:
      - provider_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U provider -d provider_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
  seed:
    build:
      context: ./seed-data
    volumes:
      - ./seed-data/working-set:/seed/working-set:ro
    environment:
      PAYER_DB_URL: postgresql://payer:payer@payer-postgres:5432/payer_db
      PROVIDER_DB_URL: postgresql://provider:provider@provider-postgres:5432/provider_db
    depends_on:
      payer-postgres:
        condition: service_healthy
      provider-postgres:
        condition: service_healthy
    restart: "no"
volumes:
  payer_data:
  provider_data:
  kafka_data:
