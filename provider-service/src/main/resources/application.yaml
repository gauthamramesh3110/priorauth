spring:
  application:
    name: provider-service
  datasource:
    url: jdbc:postgresql://localhost:5433/provider_db
    username: provider
    password: provider
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

logging:
  level:
    org.flywaydb: INFO