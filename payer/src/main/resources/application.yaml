spring:
  application:
    name: payer
  datasource:
    url: jdbc:postgresql://localhost:5434/payer_db
    username: payer
    password: payer
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

logging:
  level:
    org.flywaydb: INFO